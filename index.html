<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Moderno - Bienvenida</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; }
        header { background: #0a2540; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .btn-login { background: #00d4ff; color: #0a2540; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 50px; background: #fff; }
        .hero-content { max-width: 500px; }
        .hero-content h1 { font-size: 42px; color: #0a2540; margin-bottom: 20px; }
        .hero-content p { font-size: 18px; color: #555; margin-bottom: 30px; }
        .btn-cta { background: #0a2540; color: #fff; padding: 15px 30px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo">NeoBank</div>
        <a href="#login" class="btn-login">Banca Digital</a>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Tu dinero, más seguro y simple que nunca</h1>
            <p>Experimenta la nueva banca digital. Gestiona tus cuentas, realiza transferencias y alcanza tus metas financieras sin complicaciones.</p>
            <a href="#registro" class="btn-cta">Abrir Cuenta Digital</a>
        </div>
    </section>
</body>
</html>
